<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrative Medical Consults</title>
<meta name="description" content="Integrative Medical Consults. Professional Expertise For Complex Health Issues. Our website is currently under construction.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f5d46' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 21c.5 -4.5 2.5 -8 7 -10'/%3E%3Cpath d='M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3z'/%3E%3C/svg%3E">

<style>
  :root {
    --linen: #f7f4ee;
    --bark: #2b2a26;
    --moss-gray: #5a5f55;
    --forest: #2f5d46;
    --sage: #8aa38b;
    --clay: #9c5532;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--linen);
    color: var(--bark);
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 3rem 1.5rem;
    text-align: center;
  }
  main { max-width: 640px; width: 100%; }
  svg { display: inline-block; vertical-align: middle; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .brand svg { width: 26px; height: 26px; color: var(--forest); flex: none; }
  .brand-name {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(22px, 4vw, 28px);
    font-weight: 500;
    color: var(--bark);
    margin: 0;
  }
  .tagline {
    margin: 0 0 2.5rem;
    font-size: clamp(17px, 2.6vw, 20px);
    font-weight: 500;
    color: var(--clay);
  }
  .divider {
    width: 56px;
    height: 1px;
    background: var(--sage);
    margin: 0 auto 2.25rem;
    border: 0;
  }
  .headline {
    margin: 0 0 1.5rem;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(28px, 5.5vw, 36px);
    line-height: 1.15;
    font-weight: 500;
    color: var(--forest);
  }
  .headline span { display: block; }
  .headline em { display: block; font-weight: 400; }
  .message {
    margin: 0 auto;
    max-width: 440px;
    font-size: 17px;
    line-height: 1.7;
    color: var(--moss-gray);
  }
  .sprigs {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 2.5rem;
    color: var(--sage);
  }
  .sprigs svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 21c.5 -4.5 2.5 -8 7 -10" />
      <path d="M9 18c6.218 0 10.5 -3.288 11 -12v-2h-4.014c-9 0 -11.986 4 -12 9c0 1 0 3 2 5h3z" />
    </svg>
    <h1 class="brand-name">Integrative Medical Consults</h1>
  </div>
  <p class="tagline">Professional Expertise For Complex Health Issues</p>
  <hr class="divider">
  <h2 class="headline"><span>Something thoughtful</span><em>is taking shape.</em></h2>
  <p class="message">Our website is currently under construction. We look forward to welcoming you here soon.</p>
  <div class="sprigs" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 9a10 10 0 1 0 20 0" />
      <path d="M12 19a10 10 0 0 1 10 -10" />
      <path d="M2 9a10 10 0 0 1 10 10" />
      <path d="M12 4a9.7 9.7 0 0 1 2.99 7.5" />
      <path d="M9.01 11.5a9.7 9.7 0 0 1 2.99 -7.5" />
    </svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4" />
      <path d="M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4" />
    </svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 15h10v4a2 2 0 0 1 -2 2h-6a2 2 0 0 1 -2 -2v-4z" />
      <path d="M12 9a6 6 0 0 0 -6 -6h-3v2a6 6 0 0 0 6 6h3" />

  </div>
</main>
</body>
</html>
